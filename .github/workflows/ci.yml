name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    name: Lint, Tests, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    name: docker compose (deploy/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: .github/scripts/deploy-check.sh

  windows-app:
    name: Windows-App (setup.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # Baut zuerst die Oberfläche (npm run build:desktop), dann App und Installer.
      - run: npm run tauri:build -- --ci
      - name: Grösse prüfen (höchstens 15 MB)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "Keine setup.exe gefunden"; exit 1 }
          $mb = [math]::Round($exe.Length / 1MB, 2)
          "setup.exe: $($exe.Name) – $mb MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($exe.Length -gt 15MB) { Write-Error "setup.exe ist mit $mb MB grösser als 15 MB"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: missa-setup-exe
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 14
          if-no-files-found: error
