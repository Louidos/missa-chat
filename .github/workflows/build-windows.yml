name: Windows-Installer bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Kurztest (Import)
        run: python -c "import sys; sys.path.insert(0, 'src'); import missa_core, missa_chat"

      - name: EXE bauen (PyInstaller)
        run: pyinstaller --noconfirm --onefile --windowed --name MissaChat --paths src --hidden-import keyring.backends.Windows src/missa_chat.py

      - name: Version bestimmen
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT; else echo "v=1.0.0" >> $GITHUB_OUTPUT; fi

      - name: Installer bauen (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.v }} installer\MissaChat.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MissaChat-Windows
          path: |
            installer/Output/MissaChat-Setup.exe
            dist/MissaChat.exe

      - name: Release veröffentlichen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/MissaChat-Setup.exe
            dist/MissaChat.exe
