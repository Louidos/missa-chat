[package]
name = "missa-chat"
# Muss zur Version in package.json passen (geprüft in tests/unit/desktop.test.ts und
# beim Release). Die Version im Installer kommt aus package.json (tauri.conf.json).
version = "0.3.0"
description = "Missa-Chat als Windows-App"
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "missa_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Bewusst wenige Abhängigkeiten: kein Dateisystem-, Shell- oder HTTP-Plugin.
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"

# Klein und schnell starten: alles in eine Einheit optimieren, auf Grösse trimmen,
# Symbole entfernen, kein Abwicklungs-Code für Panics.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
